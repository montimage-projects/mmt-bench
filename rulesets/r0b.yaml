# R0b: security enabled, zero rules — the engine's fixed cost alone (#10).
# `security.enable = true` with an empty rules dir: mmt-security initialises
# and verifies every flow against nothing, so R0 - R0b - R-all decompose
# probe-only, engine overhead and rule-matching cost.
# Was BLOCKED: the pinned upstream probe segfaulted with zero verified
# rules — the snap-len upstream bug (rulesets/README.md) the fork's
# `intact-new-features` @ `7f4710d9` fixes (#42); the generated config's
# `snap-len = 65535` avoided it on any build.
schema_version: 1
kind: ruleset
tool: mmt-probe
description: security engine on, zero rules — the engine's fixed cost
rules: rulesets/empty
allow_empty: true
security:
  enable: true
