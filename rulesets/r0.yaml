# R0: security disabled — the mmt-probe baseline without the engine (#10).
# The generated mmt-probe.conf writes `security.enable = false`; the rules
# path is the deliberately empty committed dir (no .so is ever staged).
# Was BLOCKED: upstream mmt-probe v1.6.5 segfaulted with security off —
# the snap-len upstream bug (rulesets/README.md) the fork's
# `intact-new-features` @ `7f4710d9` fixes (#42); the generated config's
# `snap-len = 65535` avoided it on any build.
schema_version: 1
kind: ruleset
tool: mmt-probe
description: no security engine — the mmt-probe-only baseline of P1
rules: rulesets/empty
allow_empty: true
security:
  enable: false
