[project]
name = "mbench"
version = "0.1.0"
description = "Tool-agnostic benchmark harness for network security engines: throughput, detection and a full system-under-test record"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0.2,!=6.0.4",  # 6.0.4 is < 7 days old (2026-11-20): too new to trust
]

[project.scripts]
mbench = "mbench.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
mypy_path = ["tools/ci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools/ci"]
addopts = ["-ra", "--strict-markers"]
