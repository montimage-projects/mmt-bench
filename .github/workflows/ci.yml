name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-runs, for example after a runner or billing outage.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Use the setup-python interpreter; never download another one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      # Repo policy: GitHub-owned actions only, each pinned to a full commit SHA.
      # tools/ci/check_action_pins.py enforces it below.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check action pins
        run: python3 tools/ci/check_action_pins.py

      # No packet capture may be tracked (AGENTS.md): they live under the
      # git-ignored corpus/data/, named by sha256 in the manifest.
      - name: No packet captures in git
        run: python3 tools/ci/check_no_captures.py

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # astral-sh/setup-uv is not GitHub-owned, so uv comes from PyPI, hash-checked.
      - name: Install uv
        run: python -m pip install --require-hashes --no-deps -r .github/uv-requirements.txt

      - name: Install dependencies from the lockfile
        run: uv sync --locked --python "$(command -v python)"

      - name: Lint (ruff)
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Types (mypy)
        run: uv run --locked mypy

      - name: Tests (pytest)
        run: uv run --locked pytest

      - name: CLI entry point
        run: uv run --locked mbench --help

  smoke:
    name: smoke campaign (pipeline check)
    runs-on: ubuntu-latest
    # The image build dominates: it compiles mmt-security and mmt-probe.
    timeout-minutes: 30
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --require-hashes --no-deps -r .github/uv-requirements.txt

      - name: Install dependencies from the lockfile
        run: uv sync --locked --python "$(command -v python)"
        timeout-minutes: 3

      # The image carries the pinned mmt-dpi, mmt-security and mmt-probe; it
      # rebuilds every run — the build is short enough that a tarred-up image
      # cache is not worth a second failure mode (#9).
      - name: Build the pinned mmt-probe image
        run: docker build -t mmt-bench/mmt-probe:local tools/docker/mmt-probe
        timeout-minutes: 25

      # The campaign's ruleset is one rule of the image's mmt-security set.
      # The compiled .so rules are architecture-specific build artefacts, so
      # they are never committed: each host copies them out of its own build.
      - name: Stage the image's mmt-security ruleset
        run: tools/docker/mmt-probe/extract-rules.sh
        timeout-minutes: 2

      # Deterministic: the same bytes on every host (seed fixed, #7); the
      # capture lands in the git-ignored corpus/data/ and is never committed.
      - name: Generate the smoke pcap
        run: uv run --locked mbench corpus gen c-small --seed 0 --packets 20000 --flows 64 --label smoke
        timeout-minutes: 2

      # A CI runner is a noisy host: this checks the pipeline end to end, not
      # performance — its numbers are not results (docs/methodology.md).
      - name: Run the smoke campaign
        run: uv run --locked mbench run campaigns/smoke.yaml
        timeout-minutes: 5

      - name: Validate the run, the SUT record and the report
        run: |
          set -euo pipefail
          dir=$(echo results/*-smoke)
          uv run --locked mbench validate "$dir"/sut*.json "$dir"/runs/*.json "$dir"/REPORT*.md
          python3 tools/ci/check_smoke_result.py "$dir"
        timeout-minutes: 2

      # The result is a CI artefact, never committed: a runner's numbers are
      # a pipeline check, not a host record.
      - name: Upload the smoke result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-result
          path: results/
          if-no-files-found: error
          retention-days: 14
        timeout-minutes: 3
